models:
  gemini-1.5-pro-latest:
    type: literal
    agents: [image_generator_agent, contentgenie_orchestrator]
  gemini-2.5-flash:
    type: default
    agents: [copywriter_agent.0, design_suggester_agent.0, audience_analyst_agent.0, scheduler_agent.0, reviewer_agent.0,
      content_strategist_agent.0, agent.BaseAgent, copywriter_agent.1, design_suggester_agent.1, audience_analyst_agent.1,
      scheduler_agent.1, reviewer_agent.1, content_strategist_agent.1]

tools:
  audience_analyst_agent:
    type: agent
    agents: [contentgenie_orchestrator]
    params:
      wrapper: AgentTool
      agent: audience_analyst_agent
  content_strategist_agent:
    type: agent
    agents: [contentgenie_orchestrator]
    params:
      wrapper: AgentTool
      agent: content_strategist_agent
  copywriter_agent:
    type: agent
    agents: [contentgenie_orchestrator]
    params:
      wrapper: AgentTool
      agent: copywriter_agent
  design_suggester_agent:
    type: agent
    agents: [contentgenie_orchestrator]
    params:
      wrapper: AgentTool
      agent: design_suggester_agent
  generate_image:
    type: function
    agents: [image_generator_agent]
    params:
      description: |-
        Generates an image from a text prompt, uploads it to GCS, saves it to the ADK UI,
        and returns the GCS path. Opens the image with the default system application.
  image_generator_agent:
    type: agent
    agents: [contentgenie_orchestrator]
    params:
      wrapper: AgentTool
      agent: image_generator_agent
  reviewer_agent:
    type: agent
    agents: [contentgenie_orchestrator]
    params:
      wrapper: AgentTool
      agent: reviewer_agent
  scheduler_agent:
    type: agent
    agents: [contentgenie_orchestrator]
    params:
      wrapper: AgentTool
      agent: scheduler_agent

imports:
  Agent: google.adk.agents.Agent
  agent: agent
  AgentTool: google.adk.tools.agent_tool.AgentTool
  asyncio: asyncio
  audience_analyst_agent: subagents.audience_analyst_agent.audience_analyst_agent
  AudienceAnalystAgent: audience_analyst_agent.AudienceAnalystAgent
  BaseAgent: agents.base_agent.BaseAgent
  Client: google.genai.Client
  content_strategist_agent: subagents.content_strategist_agent.content_strategist_agent
  ContentStrategistAgent: content_strategist_agent.ContentStrategistAgent
  copywriter_agent: subagents.copywriter_agent.copywriter_agent
  CopywriterAgent: copywriter_agent.CopywriterAgent
  design_suggester_agent: subagents.design_suggester_agent.design_suggester_agent
  DesignSuggesterAgent: design_suggester_agent.DesignSuggesterAgent
  display: IPython.display
  genai: google.generativeai
  Image: PIL.Image
  image_generator_agent: subagents.image_generator_agent.image_generator_agent
  InMemoryArtifactService: google.adk.artifacts.InMemoryArtifactService
  InMemorySessionService: google.adk.sessions.InMemorySessionService
  io: io
  LiteLlm: google.adk.models.lite_llm.LiteLlm
  LlmAgent: google.adk.agents.LlmAgent
  load_dotenv: dotenv.load_dotenv
  logging: logging
  os: os
  Path: pathlib.Path
  PIL_Image: PIL.Image
  platform: platform
  prompt: prompt
  re: re
  reviewer_agent: subagents.reviewer_agent.reviewer_agent
  Runner: google.adk.runners.Runner
  scheduler_agent: subagents.scheduler_agent.scheduler_agent
  storage: google.cloud.storage
  subprocess: subprocess
  ToolContext: google.adk.tools.ToolContext
  traceback: traceback
  types: google.genai.types
  warnings: warnings

functions:
  __init__:
    type: sync
    module: agents.subagents.content_strategist_agent
    args: [self]
  _load_image_from_gcs:
    type: sync
    module: agents.subagents.reviewer_agent
    args: [self, gcs_uri]
    params:
      returns: Image.Image
  display_image:
    type: sync
    module: agents.subagents.image_generator_agent
    args: [pil_image]
    params:
      returns: None
  execute:
    type: sync
    module: agents.subagents.reviewer_agent
    args: [self, audience_analysis, content_strategy, marketing_copy, design_suggestion, image_generation_output, tool_context]
    params:
      returns: str
  generate_image:
    type: sync
    module: agents.subagents.image_generator_agent
    args: [tool_context]
    params:
      returns: dict
  is_in_notebook:
    type: sync
    module: agents.subagents.image_generator_agent
    params:
      returns: bool
  open_image_with_default_app:
    type: sync
    module: agents.subagents.image_generator_agent
    args: [image_path]
    params:
      returns: None

variables:
  GCS_BUCKET_NAME:
    type: env
    params:
      caller: [os.getenv]
      path: [agents.subagents.image_generator_agent]
  GOOGLE_API_KEY:
    type: env
    params:
      caller: [os.getenv, genai.configure]
      path: [agents.subagents.reviewer_agent]
  GOOGLE_CLOUD_LOCATION:
    type: env
    params:
      caller: [os.getenv]
      path: [agents.subagents.image_generator_agent]
  GOOGLE_CLOUD_PROJECT:
    type: env
    params:
      caller: [os.getenv]
      path: [agents.subagents.image_generator_agent]

files:
  local_path:
    type: variable
    actions: [read]
    params:
      caller: [pil_image.save]

processes:
  open:
    type: shell
    actions: [exec]
    args: [[image_path]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
  os.startfile:
    type: shell
    actions: [exec]
    args: [[image_path]]
    params:
      caller: [os.startfile]
      shell: ["False"]
  xdg-open:
    type: shell
    actions: [exec]
    args: [[image_path]]
    params:
      caller: [subprocess.run]
      shell: ["False"]
