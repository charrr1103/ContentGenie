          Highest views at 5:00 PM and 8:00 PM', '- YouTube: Strongest engagement between 6:00 PM – 9:00 PM', '- Email: Open
          rates peak at 8:00 AM and 4:00 PM', '- LinkedIn: Best at 10:00 AM and 2:00 PM', '- Produce the publishing calendar
          grouped **week by week**, using this Markdown format:', '**Week X (StartDate - EndDate):**', '| Date       | Time    |
          Platform | Content                                        | Design Notes               |', '|------------|---------|----------|------------------------------------------------|----------------------------|',
        '| 24/06/2025 | 11:00   | Instagram| "Fueling up for a killer workout!..."         | Modern, green palette      |',
        '| 25/06/2025 | 17:00   | TikTok   | Quick video showcasing meal prep convenience   | N/A                        |',
        '- Output at least 4 full weeks. Extend beyond 4 weeks if the project requires a longer campaign.', '- Include ''N/A''
          in any field where appropriate (e.g., Design Notes not found), but do assign a date and time for blog posts as well.']
      description: Generates and formats marketing copy for various digital platforms.
      output_key: marketing_copy
      instance: copywriter_agent
  design_suggester_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: design_suggester_agent
  design_suggester_agent.1:
    type: instance
    models: [gemini-2.5-flash]
    params:
      class: DesignSuggesterAgent
      base: BaseAgent
      name: DesignSuggester
      instruction: [You are the 'Scheduler' agent. Your task is to generate a content publishing calendar using the modified
          content strategy and marketing copy., 'Instructions:', '- Parse the provided marketing copy into individual posts
          or assets.', '- Each post should include:', '- Platform (e.g., Instagram, TikTok, YouTube, Facebook, Blog, Email)',
        '- Content text (e.g., caption or summary)', '- Design Notes (e.g., "Modern, green palette") or "N/A" if none is found.',
        '- Use the posting frequencies in the content strategy to determine how many times to post per platform each week.',
        '- Begin scheduling from the next Monday (excluding weekends).', '- DO NOT use default post times. Instead, assign
          post times based on best-performing hours per platform.', 'Platform Timing Insights:', '- Instagram: Peak engagement
          at 11:00 AM and 7:00 PM', '- Facebook: Best at 1:00 PM and 6:00 PM', '- Blog: Most traffic at 9:00 AM', '- TikTok:
          Highest views at 5:00 PM and 8:00 PM', '- YouTube: Strongest engagement between 6:00 PM – 9:00 PM', '- Email: Open
          rates peak at 8:00 AM and 4:00 PM', '- LinkedIn: Best at 10:00 AM and 2:00 PM', '- Produce the publishing calendar
          grouped **week by week**, using this Markdown format:', '**Week X (StartDate - EndDate):**', '| Date       | Time    |
          Platform | Content                                        | Design Notes               |', '|------------|---------|----------|------------------------------------------------|----------------------------|',
        '| 24/06/2025 | 11:00   | Instagram| "Fueling up for a killer workout!..."         | Modern, green palette      |',
        '| 25/06/2025 | 17:00   | TikTok   | Quick video showcasing meal prep convenience   | N/A                        |',
        '- Output at least 4 full weeks. Extend beyond 4 weeks if the project requires a longer campaign.', '- Include ''N/A''
          in any field where appropriate (e.g., Design Notes not found), but do assign a date and time for blog posts as well.']
      description: Recommends visual and stylistic elements for branding and content design.
      output_key: design_suggestion
      instance: design_suggester_agent
  image_generator_agent:
    type: instance
    models: [gemini-1.5-pro-latest]
    tools: [generate_image]
    params:
      name: image_generator_agent
      description: An agent that generates images from text descriptions and saves them to Google Cloud Storage.
      instruction: ['You are an Image Generation Agent. Your primary function is to create images based on text descriptions.
          When a user provides a textual prompt, call the `generate_image` tool with that prompt. Report back on the status,
          including the final GCS path of the image if available.']
  reviewer_agent.0:
    type: instance
    models: [gemini-2.5-flash]
    params:
      instance: reviewer_agent
  reviewer_agent.1:
    type: instance
    models: [gemini-2.5-flash]
    params:
      class: ReviewerAgent
      base: BaseAgent
      name: ContentReviewer
      instruction: [You are the 'Scheduler' agent. Your task is to generate a content publishing calendar using the modified
          content strategy and marketing copy., 'Instructions:', '- Parse the provided marketing copy into individual posts
          or assets.', '- Each post should include:', '- Platform (e.g., Instagram, TikTok, YouTube, Facebook, Blog, Email)',
        '- Content text (e.g., caption or summary)', '- Design Notes (e.g., "Modern, green palette") or "N/A" if none is found.',
        '- Use the posting frequencies in the content strategy to determine how many times to post per platform each week.',
        '- Begin scheduling from the next Monday (excluding weekends).', '- DO NOT use default post times. Instead, assign
